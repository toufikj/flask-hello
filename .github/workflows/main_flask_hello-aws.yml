name: Prod Automate Build-Push, Update-Task

on:
  workflow_dispatch:
    version:
        type: choice
        description: "Select version increase for image"
        default: patch
        options:
          - patch
          - minor 
          - major

env:
  AWS_REGION: "ap-south-1"
  ECR_REGISTRY: "783764579443.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_REPOSITORY: "flask"
  ECS_SERVICE: "flask-service"
  ECS_CLUSTER: "demo"
  ECS_TASK_DEFINITION: "flask"
  CONTAINER_NAME: "flask"
  Dockerfile_PATH: "."

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: 
          IMAGE_TAG: ${{ steps.versioning.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION}}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get Latest Image Tag from ECR and Increment Version
        id: versioning
        run: |
          REPO_NAME="${{ env.ECR_REPOSITORY }}"
          AWS_REGION="${{ env.AWS_REGION}}"
          
          # Fetch all image tags from ECR
          IMAGE_TAGS=$(aws ecr describe-images --repository-name $REPO_NAME --region $AWS_REGION \
            --query 'imageDetails[*].imageTags' --output json | jq -r '.[] | select(.!=null) | .[]' | sort -V)
          
          # Extract the latest semantic version (ignoring non-semantic versions)
          LATEST_TAG=$(echo "$IMAGE_TAGS" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          
          if [[ -z "$LATEST_TAG" ]]; then
            NEW_TAG="v1.0.0"  # If no valid semantic version exists, start with v1.0.0
          else
            # Remove "v" prefix if it exists
            CLEAN_TAG=$(echo "$LATEST_TAG" | sed 's/^v//')
            MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
            
            if [[ "$PATCH" -lt 10 ]]; then
              PATCH=$((PATCH + 1))  # Increment patch version
            else
              PATCH=0  # Reset patch
              if [[ "$MINOR" -lt 10 ]]; then
                MINOR=$((MINOR + 1))  # Increment minor version
              else
                MINOR=0  # Reset minor
                MAJOR=$((MAJOR + 1))  # Increment major version
              fi
            fi
            
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"  # Add "v" prefix
          fi
          
          echo "Latest Tag: $LATEST_TAG"
          echo "New Image Tag: $NEW_TAG"
          echo "IMAGE_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5.1.0
        with:
          context: ${{ env.Dockerfile_PATH }}
          file: ${{ env.Dockerfile_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Get the Current ECS Task Definition
        id: get-task-def
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      - name: Render New ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}

      - name: Display Rendered Task Definition
        run: |
          echo "📄 Rendered Task Definition:"
          cat ${{ steps.task-def.outputs.task-definition }}    
            
      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true